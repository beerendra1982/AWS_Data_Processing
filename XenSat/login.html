<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Login · XenSat Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
/* ------------------------------
   GLOBAL DARK THEME
--------------------------------*/
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at top, #0a0f1f, #050816 40%, #02010b 100%);
  color: #e8ecff;
  overflow: hidden;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Floating particles */
.particles {
  position: absolute;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}
.particles span {
  position: absolute;
  width: 4px;
  height: 4px;
  background: rgba(0,224,255,0.4);
  border-radius: 50%;
  animation: floatUp 12s linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(0); opacity: 0.4; }
  100% { transform: translateY(-120vh); opacity: 0; }
}

/* ------------------------------
   LOGIN CARD
--------------------------------*/
.login-card {
  position: relative;
  z-index: 2;
  width: 360px;
  padding: 40px 32px;
  border-radius: 18px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 18px 45px rgba(0,0,0,0.6);
  animation: fadeIn 1.2s ease forwards;
  opacity: 0;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* Glowing animated border */
.login-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 18px;
  padding: 2px;
  background: linear-gradient(135deg, #00e0ff, #7b61ff);
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  animation: glow 4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes glow {
  0% { opacity: 0.4; }
  50% { opacity: 1; }
  100% { opacity: 0.4; }
}

/* ------------------------------
   XenSat LOGO
--------------------------------*/
.logo-XenSat {
  font-size: 32px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 12px;
  background: linear-gradient(120deg, #00e0ff, #7b61ff);
  -webkit-background-clip: text;
  color: transparent;
  letter-spacing: 2px;
}

/* ------------------------------
   TEXT & INPUTS
--------------------------------*/
h2 {
  margin: 0 0 20px;
  font-size: 22px;
  text-align: center;
  color: #e8ecff;
}

input {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 16px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  color: #e8ecff;
  font-size: 14px;
  outline: none;
}
input::placeholder {
  color: #9aa0b8;
}

/* ------------------------------
   BUTTON
--------------------------------*/
button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: linear-gradient(135deg, #00e0ff, #7b61ff);
  color: #050816;
  cursor: pointer;
  box-shadow: 0 12px 30px rgba(0,224,255,0.35);
  transition: 0.2s ease;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 40px rgba(0,224,255,0.55);
}

/* ------------------------------
   FOOTER TEXT
--------------------------------*/
.footer-text {
  margin-top: 14px;
  text-align: center;
  font-size: 12px;
  color: #8a8fa8;
}
</style>
</head>

<body>

<!-- Floating particles -->
<div class="particles">
  <span style="left:10%; animation-delay:0s;"></span>
  <span style="left:30%; animation-delay:2s;"></span>
  <span style="left:50%; animation-delay:4s;"></span>
  <span style="left:70%; animation-delay:1s;"></span>
  <span style="left:90%; animation-delay:3s;"></span>
</div>

<!-- LOGIN CARD -->
<div class="login-card">

  <div class="logo-XenSat">XenSat</div>

  <h2>Login</h2>

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="login(event)">Login</button>

  <div class="footer-text"></div>
</div>

<script>
async function login(event) {
  event.preventDefault(); // Prevent page reload

  const username = document.getElementById("user").value.trim();
  const password = document.getElementById("pass").value.trim();

  if (!username || !password) {
    alert("Please enter username and password");
    return;
  }

  try {
    const res = await fetch("https://eg81nz846b.execute-api.eu-west-2.amazonaws.com/prod/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
        });

    if (!res.ok) {
      alert("Invalid credentials");
      return;
    }

    const data = await res.json();
    const token = data.token || res.headers.get("token");

    if (!token) {
      alert("Invalid credentials");
      return;
    }

    localStorage.setItem("authToken", token);
    window.location.href = "index.html";

  } catch (err) {
    alert("Unable to reach server. Check API URL.");
  }
}
</script>

</body>
</html>
